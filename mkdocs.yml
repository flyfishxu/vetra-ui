site_name: Vetra UI
site_description: A Modern, Elegant UI Design System for Compose Multiplatform
site_author: FlyFishXu
site_url: https://flyfishxu.github.io/vetra-ui/

# Repository
repo_name: flyfishxu/vetra-ui
repo_url: https://github.com/flyfishxu/vetra-ui
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2025 FlyFishXu

# Navigation
nav:
